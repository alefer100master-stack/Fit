
name: AtlasFit - Generar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          MANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager \
            -print -quit 2>/dev/null || true)

          if [ -z "$MANAGER" ]; then
            echo "::error::No se encontró sdkmanager"
            exit 1
          fi

          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"
          echo "SDK encontrado en: $SDK"
          "$MANAGER" --version

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar proyecto Android
        shell: bash
        run: |
          set -e
          echo "Contenido del repositorio:"
          ls -la

          if [ ! -d app ]; then
            echo "::error::Falta la carpeta app"
            exit 1
          fi

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Falta settings.gradle"
            exit 1
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar AtlasFit
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon --stacktrace
          else
            echo "No hay Gradle Wrapper."
            echo "Comprobando Gradle instalado..."
            gradle --version
            gradle :app:assembleDebug \
              --no-daemon --stacktrace
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AtlasFit-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
