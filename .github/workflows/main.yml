
name: Compilar AtlasFit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-24.04

    container:
      image: mingc/android-build-box:latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar archivos
        shell: bash
        run: |
          echo "Contenido del repositorio:"
          ls -la
          echo "Archivos Gradle:"
          find . -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) -print

      - name: Compilar AtlasFit
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon --stacktrace
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AtlasFit-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
