
name: Compilar AtlasFit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Aceptar licencias Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar proyecto
        shell: bash
        run: |
          ls -la
          find . -maxdepth 3 \
            -name "*.gradle" -print
          test -d app || {
            echo "ERROR: No existe carpeta app"
            exit 1
          }

      - name: Compilar APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon --stacktrace
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AtlasFit-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
