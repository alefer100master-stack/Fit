
name: Compilar AtlasFit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar estructura
        run: |
          echo "Archivos del proyecto:"
          ls -la
          echo "Archivos Gradle:"
          find . -maxdepth 3 \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "gradlew" \) -print

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon --stacktrace
          elif command -v gradle >/dev/null 2>&1; then
            gradle :app:assembleDebug \
              --no-daemon --stacktrace
          else
            echo "ERROR: No se encontró Gradle."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AtlasFit-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
